server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # /docs is a physical directory of screenshots, but the route is a SPA page.
  location = /docs/ {
    try_files /index.html =404;
  }

  location /docs/ {
    try_files $uri /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
